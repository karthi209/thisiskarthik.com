{{define "site-header"}}
  <header class="site-header">
    <div class="journal-identity">
      <a class="site-title" href="{{.BasePath}}" aria-label="for later, when i forget — by karthik">
        <span class="masthead-name">for later, when i forget</span>
        <span class="masthead-byline">by karthik</span>
      </a>
    </div>

    <nav class="site-nav" aria-label="Journal">
      <a href="{{.BasePath}}"{{if eq .PageType "home"}} aria-current="page"{{end}}>timeline</a>
      <a href="{{.BasePath}}essays"{{if eq .PageType "essays"}} aria-current="page"{{end}}>essays</a>
      <a href="{{.BasePath}}games"{{if eq .PageType "games"}} aria-current="page"{{end}}>games</a>
      <a href="{{.BasePath}}books"{{if eq .PageType "books"}} aria-current="page"{{end}}>books</a>
      <a href="{{.BasePath}}photos"{{if eq .PageType "photos"}} aria-current="page"{{end}}>photos</a>
      <a href="{{.BasePath}}about"{{if eq .PageType "about"}} aria-current="page"{{end}}>about</a>
    </nav>
  </header>
{{end}}

{{define "site-footer"}}
  <footer class="site-footer">
    <p>© {{if eq .PageType "meta"}}{{.BuildYear}}{{else}}2026{{end}} karthik</p>
    <nav aria-label="Footer">
      <a href="{{.BasePath}}about">about</a>
      <a href="{{.BasePath}}meta">meta</a>
      <a href="{{.BasePath}}rss.xml">rss</a>
    </nav>
  </footer>
{{end}}
