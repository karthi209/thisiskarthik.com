{{define "theme-loader"}}
  <script>
    try {
      const cookieTheme = document.cookie.split('; ').find(value => value.startsWith('karthik-theme='))?.split('=')[1];
      const savedTheme = cookieTheme || localStorage.getItem('karthik-theme');
      const preferredTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    } catch {}
  </script>
{{end}}

{{define "site-header"}}
  <header class="site-header">
    <div class="journal-identity">
      <a class="site-title" href="{{.BasePath}}" aria-label="for later, when i forget — by karthik">
        <span class="masthead-name">for later, when i forget</span>
        <span class="masthead-byline">by karthik</span>
      </a>
    </div>

    <nav class="site-nav" aria-label="Journal">
      <a href="{{.BasePath}}"{{if eq .PageType "home"}} aria-current="page"{{end}}>timeline</a>
      <a href="{{.BasePath}}essays"{{if eq .PageType "essays"}} aria-current="page"{{end}}>essays</a>
      <a href="{{.BasePath}}about"{{if eq .PageType "about"}} aria-current="page"{{end}}>about</a>
      <button class="theme-toggle" type="button" aria-pressed="false">
        <span class="theme-mark" aria-hidden="true">☙</span>
        <span class="theme-label">dark</span>
      </button>
    </nav>
  </header>
{{end}}

{{define "site-footer"}}
  <footer class="site-footer">
    <p>© {{if eq .PageType "meta"}}{{.BuildYear}}{{else}}2026{{end}} karthik</p>
    <nav aria-label="Footer">
      <a href="{{.BasePath}}about">about</a>
      <a href="{{.BasePath}}meta">meta</a>
      <a href="{{.BasePath}}rss.xml">rss</a>
    </nav>
  </footer>
  <script src="{{.BasePath}}js/theme.js"></script>
{{end}}
