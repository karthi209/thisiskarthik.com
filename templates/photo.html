{{define "photo.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{.Photo.Title}} — a photograph kept for later.">
  <title>{{.Photo.Title}} — photos — for later, when i forget</title>
  {{template "site-styles" .}}
  <link rel="icon" href="{{.BasePath}}favicon.png" type="image/png">
</head>
<body class="photos-page collection-dark">
  <a class="skip-link" href="#main">Skip to photograph</a>
  <div class="page-shell">
    {{template "site-header" .}}
    <main class="page-main" id="main">
      <article class="photo-page">
        <a class="back-link" href="{{.BasePath}}photos">← all photos</a>
        <header class="section-header photo-header">
          <p class="eyebrow">photograph</p>
          <h1>{{.Photo.Title}}</h1>
          <time class="photo-date" datetime="{{.Photo.DateISO}}">{{.Photo.DateLabel}}</time>
        </header>
        <figure class="photo-figure">
          <a class="photo-original" href="{{.Photo.Image}}" aria-label="Open full-size image: {{.Photo.Title}}"><img src="{{.Photo.Image}}" alt="{{.Photo.ImageAlt}}" decoding="async"></a>
          {{if .Photo.Caption}}<figcaption>{{.Photo.Caption}}</figcaption>{{end}}
        </figure>
      </article>
      {{template "site-footer" .}}
    </main>
  </div>
</body>
</html>
{{end}}
