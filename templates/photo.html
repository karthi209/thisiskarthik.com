{{define "photo.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{.Photo.Title}} — photograph by Karthik.">
  <title>{{.Photo.Title}} — photos — for later, when i forget</title>
  {{template "theme-loader" .}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
  <link href="{{.BasePath}}css/permanent.css?v=70" rel="stylesheet" type="text/css">
  <link rel="icon" href="{{.BasePath}}favicon.png" type="image/png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to photograph</a>
  <div class="page-shell">
    {{template "site-header" .}}
    <main class="page-main" id="main">
      <article class="photo-page">
        <a class="back-link" href="{{.BasePath}}photos">← all photos</a>
        <h1>{{.Photo.Title}}</h1>
        <time class="photo-date" datetime="{{.Photo.DateISO}}">{{.Photo.DateLabel}}</time>
        <figure class="photo-figure">
          <img src="{{.Photo.Image}}" alt="{{.Photo.ImageAlt}}" decoding="async">
          {{if .Photo.Caption}}<figcaption>{{.Photo.Caption}}</figcaption>{{end}}
        </figure>
      </article>
      {{template "site-footer" .}}
    </main>
  </div>
</body>
</html>
{{end}}
